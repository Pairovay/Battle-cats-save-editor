>Escribe el nivel. Ejemplos:
><@t>10<@s>+</>20</> = nivel 10, nivel + 20
><@t>10<@s>+</></> = nivel 10, mantener el nivel +
><@t><@s>+</>20</> = mantener el nivel, nivel + 20
><@t>10</> = nivel 10, nivel + 0
><@t>5<@q>-</>10<@s>+</>20<@q>-</>30</> = nivel al azar entre 5 y 10, nivel + al azar entre 20 y 30
><@t>5<@q>-</>10<@s>+</></> = nivel al azar entre 5 y 10, mantener el nivel +
><@t><@s>+</>20<@q>-</>30</> = mantener el nivel, nivel + al azar entre 20 y 30
><@t>{{max}}<@s>+</>{{max}}</> = nivel máximo y nivel + máximo
><@t>{{quit_key}}</> = salir
