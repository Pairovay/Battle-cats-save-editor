# Spanish translation of BCSFE's texts (loaded by the graphical interface).
# Format: https://codeberg.org/fieryhenry/ExampleEditorLocale#format-of-the-properties-files
# yes_key, quit_key, all and max stay in English because they are compared with typed input.

downloading=<@su>Descargando <@s>{file_name}</> de <@s>{pack_name}</> (versión <@s>{version}</>, región <@s>{country_code}</>)
failed_to_download_game_data=<@e>No se pudieron descargar los datos del juego <@s>{file_name}</> de <@s>{pack_name}</> (versión <@s>{version}</>, región <@s>{country_code}</>). URL: <@s>{url}</s> Revisa tu conexión a internet.</>
failed_to_get_game_versions=<@e>No se pudieron obtener las versiones del juego. Revisa tu conexión a internet.</>
no_device_error=<@e>No se encontró ningún dispositivo conectado</>
no_package_name_error=<@e>No se encontró Battle Cats en el dispositivo. Puede que no tenga root, o tienes que volver a intentarlo después de haber entrado al menos una vez a la base de gatos en el juego.</>
exit=Salir
tkinter_not_found=<@e>No se encontró tkinter. Si no estás en el móvil, instálalo y vuelve a intentarlo.</>
tkinter_not_found_enter_path_file=Escribe la ruta del archivo {initialfile}:
tkinter_not_found_enter_path_file_save=Escribe la ruta donde guardar el archivo {initialfile}:
