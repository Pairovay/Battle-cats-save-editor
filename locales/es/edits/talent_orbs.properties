edit_orbs_help=
>Ayuda:
>Grados disponibles: {all_grades_str}
>Atributos disponibles: {all_attributes_str}
>Efectos disponibles: {all_effects_str}
><@w>Nota: no todos los grados y efectos existen para todos los atributos.</>
>Ejemplos (se escriben en inglés):
>    <c>aku</> - elige <c>todos los orbes aku</>
>    <r>red</> <b>s</> - elige <r>todos los orbes rojos</> de grado <b>s</>
>    <b>alien</> <r>d</> <r>0</> - elige el orbe <b>alien</> de grado <r>d</> que aumenta el <r>ataque</>.
>    <o>c</> <dm>1</> - elige el orbe de mejora de Stories of Legend de grado <o>c</>
>Para elegir <@q>todos</> los orbes escribe:
>    <@q>*</>
>Para hacer <@q>varias selecciones</> sepáralas con una <@q>coma</>, así:
>    <b>s</> <bl>black</> <g>4</>,<r>d</> <o>3</>,<g>floating</>
>
