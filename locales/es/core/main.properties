welcome=
><@t>¡Bienvenido al <@s>Battle Cats Save File Editor</>!
>Hecho por <@s>fieryhenry</>
>
>Codeberg: <@s>https://codeberg.org/fieryhenry/BCSFE-Python</>
>Discord: <@s>{{discord_url}}</> - Reporta los errores en <@s>#bug-reports</> y las sugerencias en <@s>#suggestions</>
>Donaciones: <@s>https://ko-fi.com/fieryhenry</>
>
>Archivo de configuración: <@s>{config_path}</>
>
>{theme_text}
>
>{locale_text}
>
><@q>Agradecimientos:
>- <@s>Lethal's editor</> por la inspiración y por ayudar a averiguar cómo parchear el save y editar la comida de gato y la XP: <@s>https://www.reddit.com/r/BattleCatsCheats/comments/djehhn/editoren/</>
>- El código de <@s>Beeven</> y <@s>csehydrogen</>, que ayudó a averiguar cómo parchear el save: https://github.com/beeven/battlecats y https://github.com/csehydrogen/BattleCatsHacker
>- Todos los que han apoyado este trabajo: <@s>https://ko-fi.com/fieryhenry</>
>- Toda la gente del Discord por compartir saves, reportar errores, sugerir funciones y ser una comunidad increíble: <@s>{{discord_url}}</></>
>
><@w>Si has pagado por este programa, te han estafado. Es gratuito y de código abierto.</>
>
><@w>Usa esta herramienta bajo tu responsabilidad. El autor no se hace responsable de baneos ni de daños en tu save.
>El editor intenta evitarlo, pero no puede garantizar que tu save esté a salvo.
>Si tu save se daña, repórtalo igualmente en el Discord.
>Se recomienda hacer copias de seguridad antes de editar.</>

